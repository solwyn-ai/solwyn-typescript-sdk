name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  quality:
    name: Quality / Node ${{ matrix.node-major }}
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.2", "24.21.0"]
        include:
          - node-version: "22.23.2"
            node-major: 22
          - node-version: "24.21.0"
            node-major: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub workflows
        env:
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          ACTIONLINT_VERSION: 1.7.12
        run: |
          ARCHIVE="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$ARCHIVE" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $ARCHIVE" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/actionlint" actionlint
          test "$("$RUNNER_TEMP/actionlint/actionlint" -version | head -n 1)" = "$ACTIONLINT_VERSION"
          "$RUNNER_TEMP/actionlint/actionlint" .github/workflows/ci.yml .github/workflows/publish.yml
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      # pnpm must exist before setup-node can locate and restore its store cache.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm the committed lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # These checks consume build output, so they must remain after the build step.
      - run: pnpm test:dist
      - run: pnpm surfaces:check
      - run: pnpm check:public

  package-artifact:
    name: Package artifact
    if: github.event_name != 'schedule'
    needs: quality
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm the committed lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Build package inputs
        run: pnpm build
      - name: Create the package artifact once
        run: |
          mkdir -p "$ARTIFACT_DIR"
          node scripts/release-artifact.mjs create --out "$ARTIFACT_DIR" --ref "$GITHUB_SHA"
      - name: Verify receipt and artifact bytes
        run: |
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$GITHUB_SHA" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Scan the unpacked artifact
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked-artifact"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/unpacked-artifact"
          pnpm check:public --artifact-dir "$RUNNER_TEMP/unpacked-artifact"
          cat "$RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  artifact-consumers:
    name: Consumers / Node ${{ matrix.node-major }}
    if: github.event_name != 'schedule'
    needs: package-artifact
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.2", "24.21.0"]
        include:
          - node-version: "22.23.2"
            node-major: 22
          - node-version: "24.21.0"
            node-major: 24
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
      CHROME_FOR_TESTING_SHA256: 0704631fb3e4f741092e08f55272f90abc3e307f991f05f332924364415b02e0
      CHROME_FOR_TESTING_VERSION: "152.0.7977.82"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm the committed lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
      - name: Verify the downloaded artifact bytes
        run: |
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$GITHUB_SHA" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Provision pinned Chrome for Testing
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/chrome-for-testing.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FOR_TESTING_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_FOR_TESTING_SHA256  $RUNNER_TEMP/chrome-for-testing.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          CHROME="$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome"
          ACTUAL_CHROME_VERSION="$("$CHROME" --version)"
          printf 'Pinned Chrome reports: <%s>\n' "$ACTUAL_CHROME_VERSION"
          if [[ ! "$ACTUAL_CHROME_VERSION" =~ [[:space:]]([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$ ]]; then
            printf 'Could not parse the pinned Chrome version from: <%s>\n' "$ACTUAL_CHROME_VERSION" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$CHROME_FOR_TESTING_VERSION" ]]; then
            printf 'Pinned Chrome version mismatch: expected <%s>, got <%s>\n' "$CHROME_FOR_TESTING_VERSION" "${BASH_REMATCH[1]}" >&2
            exit 1
          fi
          # Ubuntu 24.04 blocks user namespaces for this raw, non-packaged binary.
          # Scope --no-sandbox to the disposable browser proof; this job has no secrets or OIDC.
          BROWSER="$RUNNER_TEMP/solwyn-verification-chrome"
          printf '#!/usr/bin/env bash\nexec %q --no-sandbox "$@"\n' "$CHROME" > "$BROWSER"
          chmod 700 "$BROWSER"
          echo "SOLWYN_VERIFICATION_BROWSER=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify package consumers against the supplied tarball
        run: pnpm test:pack -- --tarball "$TARBALL" --out "$RUNNER_TEMP/pack-results"
      - name: Run the complete installed-consumer suite against the same bytes
        run: pnpm test:consumers -- --tarball "$TARBALL" --out "$RUNNER_TEMP/consumer-results"

  legacy-installed-core:
    name: Legacy runtime / Node 20.20.2
    if: github.event_name != 'schedule'
    needs: package-artifact
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
      NODE_PATH: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.20.2
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
      - name: Verify the downloaded artifact bytes
        run: |
          EXPECTED_VERSION="$(node -p "require('./package.json').version")"
          node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$GITHUB_SHA" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Install only the reviewed package and its production dependency
        working-directory: ${{ runner.temp }}
        run: |
          mkdir legacy-consumer
          cd legacy-consumer
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$TARBALL"
      - name: Exercise the ESM core and testing entry
        working-directory: ${{ runner.temp }}/legacy-consumer
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { createRequire } from "node:module";
          import { Solwyn, VERSION, noopLogger } from "@solwyn/sdk";
          import * as nodeSdk from "@solwyn/sdk/node";
          import { FakeControlPlane } from "@solwyn/sdk/testing";
          const require = createRequire(import.meta.url);
          const manifest = require("@solwyn/sdk/package.json");
          assert.equal(VERSION, manifest.version);
          assert.equal(nodeSdk.VERSION, manifest.version);
          assert.equal(typeof nodeSdk.run, "function");
          const plane = new FakeControlPlane();
          let dispatches = 0;
          const raw = { chat: { completions: { create() { dispatches += 1; return { usage: { prompt_tokens: 2, completion_tokens: 3 } }; } } } };
          const client = new Solwyn(raw, { apiKey: plane.apiKey, apiUrl: plane.apiUrl, fetch: plane.fetch, leaseEnabled: false, logger: noopLogger, reportUntrackedSurfaces: false });
          await client.chat.completions.create({ model: "synthetic" });
          await client.close();
          assert.equal(dispatches, 1);
          assert.equal(plane.confirms.length, 1);
          NODE
      - name: Exercise the CommonJS core and testing entry
        working-directory: ${{ runner.temp }}/legacy-consumer
        run: |
          node --input-type=commonjs <<'NODE'
          const assert = require("node:assert/strict");
          const core = require("@solwyn/sdk");
          const nodeSdk = require("@solwyn/sdk/node");
          const { FakeControlPlane } = require("@solwyn/sdk/testing");
          const manifest = require("@solwyn/sdk/package.json");
          assert.equal(core.VERSION, manifest.version);
          assert.equal(nodeSdk.VERSION, manifest.version);
          assert.equal(typeof nodeSdk.run, "function");
          const { Solwyn, noopLogger } = core;
          (async () => {
            const plane = new FakeControlPlane();
            let dispatches = 0;
            const raw = { chat: { completions: { create() { dispatches += 1; return { usage: { prompt_tokens: 2, completion_tokens: 3 } }; } } } };
            const client = new Solwyn(raw, { apiKey: plane.apiKey, apiUrl: plane.apiUrl, fetch: plane.fetch, leaseEnabled: false, logger: noopLogger, reportUntrackedSurfaces: false });
            await client.chat.completions.create({ model: "synthetic" });
            await client.close();
            assert.equal(dispatches, 1);
            assert.equal(plane.confirms.length, 1);
          })().catch((error) => { process.stderr.write(`${error.stack ?? error}\n`); process.exitCode = 1; });
          NODE

  provider-surface-matrix:
    name: Provider surface catalog
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.catalog.outputs.include }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          package-manager-cache: false
      - id: catalog
        run: node scripts/provider-surface-matrix.mjs

  provider-surface-inventory:
    name: Provider surface / ${{ matrix.family }} / ${{ matrix.interval }}
    needs: provider-surface-matrix
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.provider-surface-matrix.outputs.include) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.2"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Overlay the cell's pinned provider packages
        run: |
          pnpm add --no-lockfile -D ${{ join(matrix.packages, ' ') }}
          git diff --exit-code -- pnpm-lock.yaml
      - name: Capture --check
        run: pnpm tsx scripts/capture-surface-inventory.ts --check --family ${{ matrix.family }} --interval ${{ matrix.interval }}
      - name: Canary
        if: always()
        env:
          SOLWYN_SURFACE_CANARY_FAMILY: ${{ matrix.family }}
        run: pnpm vitest run tests/unit/surface-canary.test.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: provider-surface-${{ matrix.family }}-${{ matrix.interval }}
          path: build/provider-surface-inventory
          if-no-files-found: error
          retention-days: 7

  required:
    name: Required / CI
    if: always() && github.event_name != 'schedule'
    needs:
      - quality
      - package-artifact
      - artifact-consumers
      - legacy-installed-core
      - provider-surface-matrix
      - provider-surface-inventory
    runs-on: ubuntu-24.04
    steps:
      - name: Require every launch gate
        env:
          QUALITY: ${{ needs.quality.result }}
          PACKAGE_ARTIFACT: ${{ needs.package-artifact.result }}
          ARTIFACT_CONSUMERS: ${{ needs.artifact-consumers.result }}
          LEGACY_INSTALLED_CORE: ${{ needs.legacy-installed-core.result }}
          PROVIDER_SURFACE_MATRIX: ${{ needs.provider-surface-matrix.result }}
          PROVIDER_SURFACE_INVENTORY: ${{ needs.provider-surface-inventory.result }}
        run: |
          for result in "$QUALITY" "$PACKAGE_ARTIFACT" "$ARTIFACT_CONSUMERS" "$LEGACY_INSTALLED_CORE" "$PROVIDER_SURFACE_MATRIX" "$PROVIDER_SURFACE_INVENTORY"; do
            test "$result" = success
          done
