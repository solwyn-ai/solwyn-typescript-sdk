name: Publish to npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag (for example, v0.1.0)
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-publish-solwyn-sdk
  cancel-in-progress: false

jobs:
  verify-release-commit:
    name: Verify release commit
    runs-on: ubuntu-24.04
    outputs:
      release-commit: ${{ steps.release.outputs.release-commit }}
      release-tag: ${{ steps.release.outputs.release-tag }}
      release-version: ${{ steps.release.outputs.release-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - id: release
        name: Resolve and validate the release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          MANIFEST_VERSION="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "v$MANIFEST_VERSION"
          RELEASE_COMMIT="$(git rev-parse HEAD)"
          TAGGED_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          test "$TAGGED_COMMIT" = "$RELEASE_COMMIT"
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$GITHUB_SHA" = "$RELEASE_COMMIT"
          {
            echo "release-commit=$RELEASE_COMMIT"
            echo "release-tag=$RELEASE_TAG"
            echo "release-version=$MANIFEST_VERSION"
          } >> "$GITHUB_OUTPUT"
      - name: Require a successful complete CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release-commit }}
        run: |
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$RELEASE_COMMIT&status=completed&per_page=100" \
            > "$RUNNER_TEMP/ci-runs.json"
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const releaseCommit = process.env.RELEASE_COMMIT;
          const pages = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/ci-runs.json`, "utf8"));
          const runs = pages.flatMap((page) => page.workflow_runs ?? []);
          assert.ok(runs.some((run) =>
            run.head_sha === releaseCommit &&
            run.head_branch === "main" &&
            run.event === "push" &&
            run.conclusion === "success"
          ), `No successful complete CI run found for ${releaseCommit}`);
          NODE
      - name: Require an existing package and an unused version
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.release-version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          const response = await fetch("https://registry.npmjs.org/@solwyn%2Fsdk", {
            headers: { accept: "application/vnd.npm.install-v1+json" },
          });
          assert.notEqual(response.status, 404, "Trusted publishing cannot bootstrap a package; use the explicitly approved manual RC procedure");
          assert.ok(response.ok, `npm registry returned ${response.status}`);
          const packument = await response.json();
          assert.ok(packument.versions && typeof packument.versions === "object");
          assert.ok(!(process.env.EXPECTED_VERSION in packument.versions), `Version ${process.env.EXPECTED_VERSION} already exists`);
          NODE

  build-release-artifact:
    name: Build release artifact
    needs: verify-release-commit
    runs-on: ubuntu-24.04
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
      EXPECTED_VERSION: ${{ needs.verify-release-commit.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.verify-release-commit.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release-commit.outputs.release-commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm the committed lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - name: Build package inputs
        run: pnpm build
      - name: Create the release artifact once
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          mkdir -p "$ARTIFACT_DIR"
          node scripts/release-artifact.mjs create --out "$ARTIFACT_DIR" --ref "$RELEASE_COMMIT"
      - name: Verify the publication receipt and artifact bytes
        run: node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$RELEASE_COMMIT" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Scan the unpacked release artifact
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked-artifact"
          tar -xzf "$TARBALL" -C "$RUNNER_TEMP/unpacked-artifact"
          pnpm check:public --artifact-dir "$RUNNER_TEMP/unpacked-artifact"
          cat "$RECEIPT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  verify-release-artifact:
    name: Verify release artifact / Node ${{ matrix.node-major }}
    needs:
      - verify-release-commit
      - build-release-artifact
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.23.2", "24.21.0"]
        include:
          - node-version: "22.23.2"
            node-major: 22
          - node-version: "24.21.0"
            node-major: 24
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
      CHROME_FOR_TESTING_SHA256: 0704631fb3e4f741092e08f55272f90abc3e307f991f05f332924364415b02e0
      CHROME_FOR_TESTING_VERSION: "152.0.7977.82"
      EXPECTED_VERSION: ${{ needs.verify-release-commit.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.verify-release-commit.outputs.release-commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify-release-commit.outputs.release-commit }}
      - name: Confirm the immutable release checkout
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install pinned pnpm
        run: npm install --global pnpm@10.33.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Confirm the committed lockfile is unchanged
        run: git diff --exit-code -- pnpm-lock.yaml
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
      - name: Verify the downloaded artifact bytes and receipt
        run: node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$RELEASE_COMMIT" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Provision pinned Chrome for Testing
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$RUNNER_TEMP/chrome-for-testing.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_FOR_TESTING_VERSION/linux64/chrome-linux64.zip"
          echo "$CHROME_FOR_TESTING_SHA256  $RUNNER_TEMP/chrome-for-testing.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/chrome-for-testing.zip" -d "$RUNNER_TEMP/chrome-for-testing"
          CHROME="$RUNNER_TEMP/chrome-for-testing/chrome-linux64/chrome"
          ACTUAL_CHROME_VERSION="$("$CHROME" --version)"
          printf 'Pinned Chrome reports: <%s>\n' "$ACTUAL_CHROME_VERSION"
          if [[ ! "$ACTUAL_CHROME_VERSION" =~ [[:space:]]([0-9]+\.[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$ ]]; then
            printf 'Could not parse the pinned Chrome version from: <%s>\n' "$ACTUAL_CHROME_VERSION" >&2
            exit 1
          fi
          if [[ "${BASH_REMATCH[1]}" != "$CHROME_FOR_TESTING_VERSION" ]]; then
            printf 'Pinned Chrome version mismatch: expected <%s>, got <%s>\n' "$CHROME_FOR_TESTING_VERSION" "${BASH_REMATCH[1]}" >&2
            exit 1
          fi
          # Ubuntu 24.04 blocks user namespaces for this raw, non-packaged binary.
          # Scope --no-sandbox to the disposable browser proof; this job has no secrets or OIDC.
          BROWSER="$RUNNER_TEMP/solwyn-verification-chrome"
          printf '#!/usr/bin/env bash\nexec %q --no-sandbox "$@"\n' "$CHROME" > "$BROWSER"
          chmod 700 "$BROWSER"
          echo "SOLWYN_VERIFICATION_BROWSER=$BROWSER" >> "$GITHUB_ENV"
      - name: Verify package consumers against the supplied tarball
        run: pnpm test:pack -- --tarball "$TARBALL" --out "$RUNNER_TEMP/pack-results"
      - name: Run the complete installed-consumer suite against the same bytes
        run: pnpm test:consumers -- --tarball "$TARBALL" --out "$RUNNER_TEMP/consumer-results"

  publish-npm:
    name: Publish to npm
    if: vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true'
    needs:
      - verify-release-commit
      - build-release-artifact
      - verify-release-artifact
    environment: npm-publish
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      ARTIFACT_DIR: ${{ github.workspace }}-artifact
      EXPECTED_VERSION: ${{ needs.verify-release-commit.outputs.release-version }}
      RELEASE_COMMIT: ${{ needs.verify-release-commit.outputs.release-commit }}
      RELEASE_TAG: ${{ needs.verify-release-commit.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.verify-release-commit.outputs.release-tag }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: ${{ env.ARTIFACT_DIR }}
      - name: Reverify tag, runtime, receipt, and exact bytes after approval
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          test "$RELEASE_TAG" = "v$EXPECTED_VERSION"
          test "$(node --version)" = "v24.21.0"
          npm_version="$(npm --version)"
          node -e 'const match = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(process.argv[1]); if (!match) process.exit(1); const actual = match.slice(1).map(Number); const minimum = [11, 5, 1]; for (let index = 0; index < minimum.length; index += 1) { if (actual[index] > minimum[index]) process.exit(0); if (actual[index] < minimum[index]) process.exit(1); }' "$npm_version"
          node scripts/release-artifact.mjs verify-directory --dir "$ARTIFACT_DIR" --ref "$RELEASE_COMMIT" --version "$EXPECTED_VERSION" --github-env "$GITHUB_ENV"
      - name: Reject version reuse and dist-tag rollback
        run: |
          PACKUMENT_FILE="$RUNNER_TEMP/npm-packument.json"
          export PACKUMENT_FILE
          HTTP_STATUS="$(curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --header 'accept: application/vnd.npm.install-v1+json' \
            --output "$PACKUMENT_FILE" \
            --write-out '%{http_code}' \
            https://registry.npmjs.org/@solwyn%2Fsdk)"
          test "$HTTP_STATUS" = 200
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validateReleasePolicy } from "./scripts/release-policy.mjs";
          const packument = JSON.parse(readFileSync(process.env.PACKUMENT_FILE, "utf8"));
          validateReleasePolicy({ candidate: process.env.EXPECTED_VERSION, packument });
          NODE
      - name: Publish the verified bytes with trusted publishing
        run: |
          PUBLISH_DIR="$(mktemp -d "$RUNNER_TEMP/npm-publish.XXXXXXXX")"
          trap 'rm -rf -- "$PUBLISH_DIR"' EXIT
          tar -xOf "$TARBALL" package/package.json > "$PUBLISH_DIR/package.json"
          node --input-type=module - "$PUBLISH_DIR/package.json" "$EXPECTED_VERSION" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.equal(manifest.name, "@solwyn/sdk");
          assert.equal(manifest.version, process.argv[3]);
          assert.deepEqual(manifest.publishConfig, { access: "public" });
          NODE
          while IFS= read -r name; do
            case "$name" in
              npm_config_*|NPM_CONFIG_*) unset "$name" ;;
            esac
          done < <(compgen -e)
          unset HTTP_PROXY HTTPS_PROXY ALL_PROXY NO_PROXY
          unset http_proxy https_proxy all_proxy no_proxy
          unset NODE_EXTRA_CA_CERTS NODE_TLS_REJECT_UNAUTHORIZED SSL_CERT_FILE SSL_CERT_DIR
          : > "$PUBLISH_DIR/user.npmrc"
          : > "$PUBLISH_DIR/global.npmrc"
          export NPM_CONFIG_USERCONFIG="$PUBLISH_DIR/user.npmrc"
          export NPM_CONFIG_GLOBALCONFIG="$PUBLISH_DIR/global.npmrc"
          DIST_TAG="$(node --input-type=module -e 'import { pathToFileURL } from "node:url"; const { releaseChannel } = await import(pathToFileURL(process.argv[1])); process.stdout.write(releaseChannel(process.argv[2]));' "$GITHUB_WORKSPACE/scripts/release-policy.mjs" "$EXPECTED_VERSION")"
          cd "$PUBLISH_DIR"
          NPM_SAFE_ARGS=(
            "--userconfig=$NPM_CONFIG_USERCONFIG"
            "--globalconfig=$NPM_CONFIG_GLOBALCONFIG"
            "--registry=https://registry.npmjs.org"
            "--@solwyn:registry=https://registry.npmjs.org"
            "--proxy=null"
            "--https-proxy=null"
            "--strict-ssl=true"
            "--dry-run=false"
            "--ignore-scripts=true"
            "--access=public"
            "--provenance=true"
          )
          test "$(npm config get registry "${NPM_SAFE_ARGS[@]}")" = https://registry.npmjs.org/
          test "$(npm config get @solwyn:registry "${NPM_SAFE_ARGS[@]}")" = https://registry.npmjs.org
          test "$(npm config get proxy "${NPM_SAFE_ARGS[@]}")" = null
          test "$(npm config get https-proxy "${NPM_SAFE_ARGS[@]}")" = null
          test "$(npm config get strict-ssl "${NPM_SAFE_ARGS[@]}")" = true
          test "$(npm config get cafile "${NPM_SAFE_ARGS[@]}")" = null
          test "$(npm config get ca "${NPM_SAFE_ARGS[@]}")" = null
          test "$(npm config get dry-run "${NPM_SAFE_ARGS[@]}")" = false
          test "$(npm config get ignore-scripts "${NPM_SAFE_ARGS[@]}")" = true
          test "$(npm config get access "${NPM_SAFE_ARGS[@]}")" = public
          test "$(npm config get provenance "${NPM_SAFE_ARGS[@]}")" = true
          npm publish "$TARBALL" "${NPM_SAFE_ARGS[@]}" "--tag=$DIST_TAG"
